[build-system]
requires=["hatchling"]
build-backend="hatchling.build"
[project]
name="fireworks-graph-mcp"
version="0.1.0"
requires-python=">=3.10"
dependencies=["mcp>=1.12,<2", "resvg-py>=0.2",]
[project.scripts]
fireworks-graph-mcp="skill_service.server:main"
[tool.hatch.build.targets.wheel]
packages=["src/skill_service"]
[tool.hatch.build]
exclude=["**/__pycache__/**","**/*.pyc"]

